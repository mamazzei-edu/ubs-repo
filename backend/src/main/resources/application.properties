spring.application.name=ubs
server.port=8080

##mariadb
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.default_schema=ubs
spring.jpa.show.sql=true


## Para autenticação JWR

security.jwt.secret-key=${SPRING_JWT_SECRET_KEY}
# 1h in millisecond
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME}
spring.security.enabled=true

spring.application.name=ubs

