## =============================================================================
## Configuracao do backend.
##
## PADRAO DE NOMES: cada variavel de ambiente e o nome da propriedade Spring em
## MAIUSCULAS, com "." e "-" trocados por "_" (o "relaxed binding" do Spring):
##
##     security.jwt.secret-key   <->   SECURITY_JWT_SECRET_KEY
##     lista.hosts               <->   LISTA_HOSTS
##
## Assim uma variavel do .env sempre tem um unico nome no compose.yaml, aqui e
## no codigo. A lista completa, com exemplos, esta em .env.exemplo.
## =============================================================================

spring.application.name=ubs
server.port=${SERVER_PORT:8080}

## ---- Banco de dados (MySQL) ------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
## Quanto tempo esperar por uma conexao com o banco (ms). O padrao do Hikari
## e 30s: com o MySQL fora, o GET /status levava 30s para responder e o app
## mobile desistia antes (15s), mostrando "servidor demorou" em vez de
## "banco indisponivel". 5s sobra para um banco saudavel.
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.generate-ddl=${SPRING_JPA_GENERATE_DDL:true}
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:ubs}
## Era "spring.jpa.show.sql", chave que o Spring nao conhece: nunca teve efeito.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

## ---- Autenticacao JWT ------------------------------------------------------
## SPRING_JWT_SECRET_KEY e o nome antigo, aceito so para nao quebrar .env
## existentes. Usar SECURITY_JWT_SECRET_KEY.
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:${SPRING_JWT_SECRET_KEY}}
## Em milissegundos: 3600000 = 1h.
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:3600000}
spring.security.enabled=${SPRING_SECURITY_ENABLED:true}

## ---- CORS -------------------------------------------------------------------
## Origens do navegador liberadas, separadas por virgula. Parametro interno do
## projeto: no .env e LISTA_HOSTS.
lista.hosts=${LISTA_HOSTS:http://localhost:4200}

## ---- Caminhos publicos ------------------------------------------------------
## Prefixo publico da API, vindo do .env. Vazio = raiz.
## O nginx repassa a URI inalterada; e o Spring que conhece o prefixo.
server.servlet.context-path=${API_BASE_PATH:}

## Honra X-Forwarded-Proto/Host do proxy reverso. Sem isto, com o TLS
## terminando fora, o Spring enxergaria http e geraria redirects errados.
server.forward-headers-strategy=framework
