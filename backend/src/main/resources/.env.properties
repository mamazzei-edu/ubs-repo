# ==========================================================================
# Arquivo de configuracao importado pelo Spring Boot:
#   spring.config.import=classpath:.env.properties  (em application.properties)
#
# Este arquivo e OBRIGATORIO para a aplicacao iniciar. Esta no .gitignore,
# por isso precisa ser criado localmente.
#
# Os valores abaixo sao defaults para execucao LOCAL (sem Docker).
# Ao rodar via Docker Compose, as variaveis de ambiente do compose
# SOBRESCREVEM estes valores (env vars tem prioridade sobre o classpath).
# ==========================================================================

DB_URL=jdbc:mysql://localhost:3306/ubs?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
DB_USER=root
DB_PASSWORD=12345678

# Origens permitidas para CORS (separadas por virgula). Frontend Angular.
LISTA_HOSTS=http://localhost:4200
